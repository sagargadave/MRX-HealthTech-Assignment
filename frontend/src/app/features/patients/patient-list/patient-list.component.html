<div class="page-container">
  <div class="page-header">
    <h1>Patients</h1>
    <button mat-flat-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Add Patient
    </button>
  </div>

  <div class="app-card filters-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search by Patient ID or Name</mat-label>
      <input matInput [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="gender-field">
      <mat-label>Gender</mat-label>
      <mat-select [(ngModel)]="genderFilter" (selectionChange)="fetchPatients()">
        <mat-option value="All">All</mat-option>
        <mat-option value="Male">Male</mat-option>
        <mat-option value="Female">Female</mat-option>
        <mat-option value="Other">Other</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="app-card">
    <div class="loading-row" *ngIf="loading()">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <div class="empty-state" *ngIf="!loading() && patients().length === 0">
      <mat-icon>groups</mat-icon>
      <p>No patients found.</p>
    </div>

    <table mat-table [dataSource]="patients()" class="data-table" *ngIf="!loading() && patients().length > 0">
      <ng-container matColumnDef="patient_id">
        <th mat-header-cell *matHeaderCellDef>Patient ID</th>
        <td mat-cell *matCellDef="let p">{{ p.patient_id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let p">{{ p.name }}</td>
      </ng-container>

      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef>Age</th>
        <td mat-cell *matCellDef="let p">{{ p.age }}</td>
      </ng-container>

      <ng-container matColumnDef="gender">
        <th mat-header-cell *matHeaderCellDef>Gender</th>
        <td mat-cell *matCellDef="let p">
          <span
            class="status-chip"
            [ngClass]="{
              'chip-male': p.gender === 'Male',
              'chip-female': p.gender === 'Female',
              'chip-other': p.gender === 'Other'
            }"
            >{{ p.gender }}</span
          >
        </td>
      </ng-container>

      <ng-container matColumnDef="medical_history">
        <th mat-header-cell *matHeaderCellDef>Medical History</th>
        <td mat-cell *matCellDef="let p" class="truncate-cell">{{ p.medical_history || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="test_record_count">
        <th mat-header-cell *matHeaderCellDef># Records</th>
        <td mat-cell *matCellDef="let p">{{ p.test_record_count }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button matTooltip="View" (click)="viewPatient(p)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Edit" (click)="openEditDialog(p)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete" (click)="confirmDelete(p)">
            <mat-icon color="warn">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
