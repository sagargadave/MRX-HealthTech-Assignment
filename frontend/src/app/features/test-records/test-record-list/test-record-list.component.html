<div class="page-container">
  <div class="page-header">
    <h1>Test Records</h1>
    <button mat-flat-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Add Test Record
    </button>
  </div>

  <div class="app-card">
    <div class="loading-row" *ngIf="loading()">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <div class="empty-state" *ngIf="!loading() && records().length === 0">
      <mat-icon>science</mat-icon>
      <p>No test records available.</p>
    </div>

    <table mat-table [dataSource]="records()" class="data-table" *ngIf="!loading() && records().length > 0">
      <ng-container matColumnDef="patient">
        <th mat-header-cell *matHeaderCellDef>Patient</th>
        <td mat-cell *matCellDef="let r">
          <a class="patient-link" (click)="openPatient(r)">{{ r.patientId }} - {{ r.patientName }}</a>
        </td>
      </ng-container>

      <ng-container matColumnDef="biomarker">
        <th mat-header-cell *matHeaderCellDef>Biomarker</th>
        <td mat-cell *matCellDef="let r">{{ r.biomarker }}</td>
      </ng-container>

      <ng-container matColumnDef="result">
        <th mat-header-cell *matHeaderCellDef>Result</th>
        <td mat-cell *matCellDef="let r">{{ r.resultValue }}</td>
      </ng-container>

      <ng-container matColumnDef="unit">
        <th mat-header-cell *matHeaderCellDef>Unit</th>
        <td mat-cell *matCellDef="let r">{{ r.unit }}</td>
      </ng-container>

      <ng-container matColumnDef="testDate">
        <th mat-header-cell *matHeaderCellDef>Test Date</th>
        <td mat-cell *matCellDef="let r">{{ r.testDate | date: 'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button matTooltip="Edit" (click)="openEditDialog(r)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete" (click)="confirmDelete(r)">
            <mat-icon color="warn">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
