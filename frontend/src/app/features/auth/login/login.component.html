<div class="login-page">
  <div class="login-card app-card">
    <div class="login-header">
      <mat-icon>monitor_heart</mat-icon>
      <h1>Healthcare Monitoring Dashboard</h1>
      <p>Sign in to your doctor account to continue</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
        <mat-error *ngIf="form.controls.email.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">Please enter a valid email address.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword() ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword.set(!hidePassword())"
          [attr.aria-label]="'Toggle password visibility'"
        >
          <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.controls.password.hasError('required')">Password is required.</mat-error>
      </mat-form-field>

      <div class="error-banner" *ngIf="errorMessage()">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>

      <button mat-flat-button color="primary" class="full-width login-btn" type="submit" [disabled]="loading()">
        <mat-spinner *ngIf="loading()" diameter="20" class="btn-spinner"></mat-spinner>
        <span *ngIf="!loading()">Sign In</span>
      </button>
    </form>

    <div class="demo-hint">
      <a routerLink="/register">Create an account</a><br>
      Demo credentials: <strong>doctor&#64;example.com</strong> / <strong>Doctor&#64;123</strong>
    </div>
  </div>
</div>
