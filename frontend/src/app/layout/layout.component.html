<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <mat-icon>monitor_heart</mat-icon>
      <span>Healthcare Monitor</span>
    </div>

    <nav class="nav-list">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button mat-stroked-button color="primary" class="full-width" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>
  </aside>

  <div class="main-area">
    <mat-toolbar class="topbar">
      <span class="spacer"></span>
      <div class="doctor-chip" *ngIf="auth.currentUser() as user">
        <mat-icon>account_circle</mat-icon>
        <span>{{ user.name }}</span>
      </div>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
